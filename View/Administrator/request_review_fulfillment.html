<!DOCTYPE html>
<html lang="th" data-root="../.." data-allowed="Administrator">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตรวจสอบการจ่ายอุปกรณ์</title>
    <link rel="stylesheet" href="../../style.css" />
</head>

<body data-app-shell="admin" data-page="requests" data-shell-title="ตรวจสอบคำขอเบิกอุปกรณ์">
    <main class="page detail-page request-fulfillment-page">
        <section class="page-head">
            <div>
                <p class="breadcrumb"><a id="fulfillmentBackLink" href="./request_review.html">← กลับไปหน้าตรวจสอบคำขอ</a></p>
                <h2 id="fulfillmentTitle">กำลังเตรียมข้อมูล...</h2>
                <p class="date" id="fulfillmentDate">วันที่ ...</p>
            </div>
        </section>

        <div class="form-alert" id="fulfillmentMessage" role="alert" hidden></div>

        <section class="detail-card">
            <header class="detail-card-head">
                <div>
                    <h3>รายละเอียดการตรวจสอบ</h3>
                    <p>ใช้หน้าเพจนี้เพื่อบันทึกการตรวจสอบและการจ่ายอุปกรณ์ในแต่ละบรรทัดคำขอ</p>
                </div>
            </header>
            <div class="review-line-body">
                <p class="review-line-ref" id="fulfillmentLineIdentifier">รหัสบรรทัดคำขอ: —</p>
                <p class="review-line-progress" id="fulfillmentLineDetail">หมายเลขบรรทัด: —</p>
            </div>
        </section>
    </main>

    <script src="../../Controller/common/admin_shell.js" defer></script>
    <script src="../../Controller/common/role_guard.js" defer></script>
    <script src="../../Controller/common/ui_shell.js" defer></script>
    <script src="../../Controller/Administrator/request_review_fulfillment.js" defer></script>
</body>

</html>
